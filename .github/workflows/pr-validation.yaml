name: PR Validation

on:
  pull_request:
    branches:
      - develop  

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      
      - name: Install dependencies
        run: npm install  

      - name: Lint HTML files
        run: npx htmlhint "src/**/*.html" 

      - name: Lint CSS files
        run: npx stylelint "styles/**/*.css" 

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install  

      - name: Build the static website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"  